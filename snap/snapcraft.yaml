name: all-city
title: "All City"
adopt-info: all-city
base: core24
summary: Skate a copy of your own town and paint it before the other crews do.
description: |
  All City turns real towns into skate parks. Its Cartographer builds each
  town from OpenStreetMap: the streets and buildings, the steps and their
  handrails, the fences, kerbs and ledges, so a town is a skate park
  nobody designed. Skate it, grind it, climb it, and put your name up.

  This is an early build: a real town and its staircases, to find out how
  a real handrail feels under your skates.

  - Skate, grind, wall ride and climb your way round a real town
  - Cel-shaded and lit like a music video
  - A calm camera: no shake and no roll, with Reduce flashing
  - Made for controllers and handhelds, fully playable with a keyboard
    and mouse

  Map data © OpenStreetMap contributors, available under the Open
  Database License (https://www.openstreetmap.org/copyright).
icon: icon.png
grade: stable
confinement: strict
compression: lzo
license: MIT AND CC0-1.0 AND OFL-1.1 AND Apache-2.0
website: https://github.com/LinuxGroove/all-city
source-code: https://github.com/LinuxGroove/all-city
issues: https://github.com/LinuxGroove/all-city/issues

platforms:
  amd64:
  arm64:

apps:
  all-city:
    command: bin/all-city
    extensions: [gnome]
    plugs:
      - audio-playback
      - joystick
      - network

parts:
  all-city:
    plugin: nil
    source: .
    build-packages:
      - curl
      - unzip
      - ca-certificates
      - libfontconfig1
    stage-packages:
      - libasound2t64
      - libpulse0
      - libdecor-0-0
      - libfontconfig1
      - libudev1
      - libwayland-client0
      - libwayland-cursor0
      - libwayland-egl1
      - libxkbcommon0
      - libx11-6
      - libxcursor1
      - libxext6
      - libxi6
      - libxinerama1
      - libxrandr2
      - libxrender1
      - libdbus-1-3
    override-pull: |
      craftctl default
      craftctl set version="$(sed -n 's/^config\/version="\(.*\)"/\1/p' project.godot)"
    override-build: |
      # Godot version used to export; keep in step with the project.
      GODOT_VERSION=4.7.2
      case "$CRAFT_ARCH_BUILD_FOR" in
        amd64) ARCH=x86_64; PRESET=Linux ;;
        arm64) ARCH=arm64; PRESET="Linux ARM64" ;;
        *) echo "Unsupported architecture: $CRAFT_ARCH_BUILD_FOR"; exit 1 ;;
      esac
      BASE="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
      curl -sSfL -o godot.zip "$BASE/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}.zip"
      curl -sSfL -o templates.tpz "$BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
      unzip -o -q godot.zip
      GODOT="$PWD/Godot_v${GODOT_VERSION}-stable_linux.${ARCH}"
      export HOME="$PWD/.home"
      TEMPLATES="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      mkdir -p "$TEMPLATES"
      unzip -o -q -j templates.tpz "templates/linux_release.${ARCH}" templates/version.txt -d "$TEMPLATES"
      "$GODOT" --headless --path . --import
      mkdir -p "$CRAFT_PART_INSTALL/game" "$CRAFT_PART_INSTALL/bin"
      "$GODOT" --headless --path . --export-release "$PRESET" "$CRAFT_PART_INSTALL/game/all-city"
      test -f "$CRAFT_PART_INSTALL/game/all-city.pck"
      install -m 755 snap/local/all-city "$CRAFT_PART_INSTALL/bin/"
      cp LICENSE CREDITS.md "$CRAFT_PART_INSTALL/game/"
      # The fonts' and characters' own licences go with them.
      mkdir -p "$CRAFT_PART_INSTALL/game/licences"
      cp assets/fonts/*.txt assets/people/*License.txt "$CRAFT_PART_INSTALL/game/licences/"
