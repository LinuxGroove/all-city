name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  GODOT_VERSION: 4.7.2

defaults:
  run:
    # Named explicitly so pipefail is on and a failing Godot run fails the
    # step even though its output goes through tee.
    shell: bash

jobs:
  test:
    name: Godot checks and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl -sSfL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
      - name: Import
        run: godot --headless --path . --import
      - name: Check every script
        run: godot --headless --path . tools/check_scripts.tscn 2>&1 | tee check.log; ! grep -q "SCRIPT ERROR" check.log
      - name: Run tests
        timeout-minutes: 20
        run: godot --headless --path . tests/run_tests.tscn 2>&1 | tee test.log; ! grep -q "SCRIPT ERROR" test.log
      - name: Play Monaco
        timeout-minutes: 10
        run: godot --headless --path . tools/play_check.tscn -- --town=monaco 2>&1 | tee play.log; ! grep -q "SCRIPT ERROR" play.log

  cartographer:
    name: Cartographer tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Cartographer's packages
        run: python3 -m pip install -r cartographer/requirements.txt
      - name: Run the Cartographer's tests
        run: python3 -m unittest discover -s cartographer/tests -t .
